name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 공개 레포는 소스 전용(package-lock.json 미포함)이라 npm ci/캐시 대신 npm install 사용.
      # eslint v9 등 peer 의존 충돌 회피를 위해 --legacy-peer-deps.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build
