name: Publish to npm

# 수동 실행 전용(workflow_dispatch). Trusted Publishing(OIDC) — 토큰·OTP 불필요.
# npm 패키지 설정에서 이 repo+워크플로를 Trusted Publisher 로 연결해야 동작한다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run (발행 안 함)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # OIDC — Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (OIDC Trusted Publishing 지원 = npm >= 11.5.1, node20 호환 = 11.x)
        run: npm install -g npm@11

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Strip source maps (npm 패키지엔 .map 미포함)
        run: find dist -name '*.map' -delete

      - name: Guard — 금지 문자열(AUI) 0건
        run: |
          if grep -rniE 'aui[ _-]?grid|auigrid' dist src 2>/dev/null; then
            echo "::error::금지 문자열(AUI) 발견 — 발행 중단"; exit 1
          fi
          echo "AUI 0건 확인"

      - name: Pack 확인(발행될 파일)
        run: npm pack --dry-run

      - name: Publish (OIDC / Trusted Publishing)
        if: ${{ inputs.dry_run == false }}
        run: npm publish --access public
